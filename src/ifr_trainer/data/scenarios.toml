# Instrument flying scenarios shared by every aircraft. The aircraft starts in the air, trimmed.
# Position: distance_nm before the runway threshold on the extended centreline,
# then offset_nm to the right of it (negative = left). altitude_ft is MSL; the field is at 500 ft.
# [name.cockpit] sets the radios, references and the minimum (see sim/cockpit.py).
#
# Each aircraft's scenarios.toml adds its speed (cas_kt), flaps and gear and its own cockpit
# settings, and may override anything here. Only the scenarios it lists are offered for it.
# At the minimum you are still in cloud: go around.

[ils36]
description = "Vectors for ILS 36: heading 330, 2500 ft. Intercept, fly to DA 700, go around."
runway = "36"
distance_nm = 12.0
offset_nm = 2.5
heading_deg = 330.0
altitude_ft = 2500.0
[ils36.cockpit]
ils_mhz = 110.30
ils_crs = 360.0
hdg_bug = 330.0
alt_target_ft = 3000.0
minimum_ft = 700.0

