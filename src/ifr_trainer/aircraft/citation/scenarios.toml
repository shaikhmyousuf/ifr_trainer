# Business jet (Citation II data) settings for the shared scenarios (ifr_trainer/data/scenarios.toml):
# speed, flaps (0 = up, 1 = 15 deg, 2 = 40 deg), gear and EFIS settings (as on the A320).
# Typical speeds at mid weight (VREF about 108 kt): 180 kt clean on vectors and in the hold,
# 140 kt with flaps 15 and gear down for a non-precision approach, VREF + 10 = 118 kt with
# flaps 40 on the ILS.

[ils36]
cas_kt = 180.0
[ils36.cockpit]
nd_mode = "ROSE ILS"
needle1 = "VOR1"
needle2 = "ADF2"

[ils36_established]
cas_kt = 118.0
flaps = 2
gear_down = true
[ils36_established.cockpit]
nd_mode = "ROSE ILS"

[ils36_xwind]
cas_kt = 118.0
flaps = 2
gear_down = true
[ils36_xwind.cockpit]
nd_mode = "ROSE ILS"

[ils18]
cas_kt = 180.0
[ils18.cockpit]
nd_mode = "ROSE ILS"
needle2 = "ADF2"

[vor36]
cas_kt = 140.0
flaps = 1
gear_down = true
[vor36.cockpit]
nd_mode = "ROSE VOR"
needle1 = "VOR1"
needle2 = "OFF"

[ndb36]
cas_kt = 140.0
flaps = 1
gear_down = true
[ndb36.cockpit]
nd_mode = "ROSE VOR"
needle1 = "ADF1"
needle2 = "VOR2"

[vor_tracking]
cas_kt = 200.0
[vor_tracking.cockpit]
nd_mode = "ROSE VOR"
nd_range = 40
needle1 = "VOR1"
needle2 = "VOR2"

[hold_trn]
cas_kt = 180.0
[hold_trn.cockpit]
nd_mode = "ROSE VOR"
nd_range = 20
needle1 = "VOR1"
needle2 = "VOR2"

[upper_air]
cas_kt = 250.0
[upper_air.cockpit]
nd_mode = "ARC"
nd_range = 40
